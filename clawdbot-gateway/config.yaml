name: OpenClaw Gateway
version: "3.1.10"
slug: clawdbot-gateway
description: Pre-built WhatsApp gateway with AI agent capabilities
url: https://github.com/openclaw/openclaw

# Bootstrap image - openclaw is installed/updated at runtime from git
image: ghcr.io/michaelhaessig/clawdbot-gateway-{arch}

arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
host_network: true

# Enable Home Assistant API access (injects SUPERVISOR_TOKEN)
hassio_api: true
homeassistant_api: true

# Ingress allows accessing the web UI through Home Assistant
ingress: true
ingress_port: 18789
ingress_stream: true

ports:
  18789/tcp: 18789
  18790/tcp: 18790

ports_description:
  18789/tcp: Gateway API / Web UI
  18790/tcp: Bridge WebSocket

map:
  - config:rw
  - share:rw

options:
  # Gateway settings
  gateway_port: 18789
  bridge_port: 18790
  gateway_token: ""
  workspace: "/share/openclaw"
  vacuum_entity: ""
  gog_keyring: ""
  # Self-update settings
  openclaw_repo: "https://github.com/openclaw/openclaw.git"
  openclaw_version: "main"
  update_mode: "bundled"
  pin_version: false

schema:
  # Gateway settings
  gateway_port: port
  bridge_port: port
  gateway_token: str?
  workspace: str
  vacuum_entity: str?
  gog_keyring: str?
  # Self-update settings
  openclaw_repo: url?
  openclaw_version: str?
  update_mode: list(bundled|disabled|check|auto)?
  pin_version: bool?

environment:
  OPENCLAW_STATE_DIR: /config/openclaw
  OPENCLAW_WORKSPACE_DIR: /share/openclaw
  OPENCLAW_APP_DIR: /config/openclaw-app

panel_icon: mdi:whatsapp
panel_title: OpenClaw
