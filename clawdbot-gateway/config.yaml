name: Clawdbot Gateway
version: "2.0.5"
slug: clawdbot-gateway
description: Self-updating WhatsApp gateway with AI agent capabilities
url: https://github.com/michaelhaessig/clawdbot

# Bootstrap image - clawdbot is installed/updated at runtime from git
image: ghcr.io/michaelhaessig/clawdbot-gateway-{arch}

arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false

# Enable Home Assistant API access (injects SUPERVISOR_TOKEN)
hassio_api: true
homeassistant_api: true

# Ingress allows accessing the web UI through Home Assistant
ingress: true
ingress_port: 18789
ingress_stream: true

ports:
  18789/tcp: 18789
  18790/tcp: 18790

ports_description:
  18789/tcp: Gateway API / Web UI
  18790/tcp: Bridge WebSocket

map:
  - config:rw
  - share:rw

options:
  # Gateway settings
  gateway_port: 18789
  bridge_port: 18790
  gateway_token: ""
  workspace: "/share/clawdbot"
  vacuum_entity: ""
  # Self-update settings
  clawdbot_repo: "https://github.com/clawdbot/clawdbot.git"
  clawdbot_version: "main"
  update_mode: "auto"
  pin_version: false

schema:
  # Gateway settings
  gateway_port: port
  bridge_port: port
  gateway_token: str?
  workspace: str
  vacuum_entity: str?
  # Self-update settings
  clawdbot_repo: url?
  clawdbot_version: str?
  update_mode: list(disabled|check|auto)?
  pin_version: bool?

environment:
  CLAWDBOT_STATE_DIR: /config/clawdbot
  CLAWDBOT_WORKSPACE_DIR: /share/clawdbot
  CLAWDBOT_APP_DIR: /config/clawdbot-app

panel_icon: mdi:whatsapp
panel_title: Clawdbot
